<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ByaheTayo phone nav preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #eef2f7; font-family: Arial, Helvetica, sans-serif; display: flex; gap: 32px; justify-content: center; padding: 28px; }
  .label { text-align: center; font-weight: bold; font-size: 18px; color: #0f172a; margin-bottom: 12px; }
  .phone { width: 360px; height: 740px; background: #fff; border: 10px solid #111827; border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 26px; background: #111827; border-radius: 14px; z-index: 5; }
  .status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 13px; font-weight: bold; color: #0f172a; background: #fff; }
  .appbar { height: 56px; background: #2563eb; color: #fff; display: flex; align-items: center; padding: 0 18px; font-size: 20px; font-weight: bold; }
  .maparea { flex: 1; background: #f5f1e6; position: relative; }
  .maparea .roads { position: absolute; inset: 0; background:
    linear-gradient(90deg, transparent 49%, #e2ddd0 49%, #e2ddd0 51%, transparent 51%),
    linear-gradient(0deg, transparent 29%, #e2ddd0 29%, #e2ddd0 31%, transparent 31%),
    linear-gradient(0deg, transparent 69%, #e2ddd0 69%, #e2ddd0 71%, transparent 71%); }
  .pin { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -100%); width: 44px; height: 44px; }
  .mapnote { position: absolute; left: 12px; bottom: 12px; font-size: 13px; color: #64748b; background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 8px; }
  .bottomnav { height: 76px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; padding: 6px 4px 10px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #64748b; width: 48px; }
  .item .pill { width: 48px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .item .pill svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item.active { color: #2563eb; font-weight: bold; }
  .item.active .pill { background: #dbeafe; }
  .homebar { height: 20px; display: flex; justify-content: center; align-items: center; background: #fff; }
  .homebar i { display: block; width: 120px; height: 5px; border-radius: 3px; background: #111827; }
  .androidbtns { height: 20px; display: flex; justify-content: space-around; align-items: center; background: #fff; color: #111827; font-size: 14px; }
</style>
</head>
<body>
  <div>
    <div class="label">Android phone</div>
    <div class="phone">
      <div class="status"><span>9:17</span><span>76%</span></div>
      <div class="appbar">Map</div>
      <div class="maparea"><div class="roads"></div>
        <svg class="pin" viewBox="0 0 24 24"><path d="M12 2 C7 2 3 6 3 10 C3 16 12 22 12 22 C12 22 21 16 21 10 C21 6 17 2 12 2Z" fill="#2563eb" stroke="none"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="none"/></svg>
        <div class="mapnote">Map area (preview ng design)</div></div>
      <div class="bottomnav">
        <div class="item active"><div class="pill"><svg viewBox="0 0 24 24"><path d="M9 3 L15 5 L21 3 V18 L15 20 L9 18 L3 20 V5 Z"/><path d="M9 3 V18 M15 5 V20"/></svg></div>Map</div>
        <div class="item"><div class="pill"><svg viewBox="0 0 24 24"><path d="M4 20 C8 20 8 12 12 12 C16 12 16 4 20 4"/><circle cx="4" cy="20" r="2" fill="currentColor" stroke="none"/><circle cx="20" cy="4" r="2" fill="currentColor" stroke="none"/></svg></div>Trips</div>
        <div class="item"><div class="pill"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10 H21"/><circle cx="16" cy="15" r="1.5"/></svg></div>Fares</div>
        <div class="item"><div class="pill"><svg viewBox="0 0 24 24"><path d="M12 4 L2 9 L12 14 L22 9 Z"/><path d="M6 11 V16 C6 17 9 19 12 19 C15 19 18 17 18 16 V11"/></svg></div>Student</div>
        <div class="item"><div class="pill"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7 V5 H15 V7 M3 12 H21"/></svg></div>Employed</div>
        <div class="item"><div class="pill"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19 C3 15 6 13 9 13 C12 13 15 15 15 19"/><circle cx="17" cy="9" r="2.5"/><path d="M16 13.5 C18 13.5 20 15 20 18.5"/></svg></div>Friends</div>

      </div>

    </div>
  </div>

</html>
