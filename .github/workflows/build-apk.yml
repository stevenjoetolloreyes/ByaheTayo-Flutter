name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (remove unused preinstalled tools)
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk  # old NDKs we don't use
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -af || true
          echo "=== Disk space AFTER cleanup ==="
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
          pub-cache: true

      - name: Restore default launcher icons
        run: |
          flutter create --platforms=android --project-name tempicons /tmp/tempicons
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            if [ -f "/tmp/tempicons/android/app/src/main/res/mipmap-$d/ic_launcher.png" ]; then
              cp "/tmp/tempicons/android/app/src/main/res/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            fi
          done

      - name: Check MAPS_API_KEY secret
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Write local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(which flutter)")")"
          {
            echo "MAPS_API_KEY=$MAPS_API_KEY"
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "debug.keystore=$HOME/.android/debug.keystore"
          } > android/local.properties

      - run: flutter pub get
      - run: flutter test
        continue-on-error: true

      - name: Disk space check (before NDK download)
        run: |
          echo "=== Disk space before NDK download/build ==="
          df -h
          echo "=== Memory ==="
          free -h

      - name: Build APK
        timeout-minutes: 25
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build apk --release --verbose --dart-define=MAPS_API_KEY="$MAPS_API_KEY"

      - name: Disk space check (after build)
        if: always()
        run: |
          echo "=== Disk space after build attempt ==="
          df -h
          echo "=== Memory ==="
          free -h
          echo "=== Largest directories under ~/.gradle and ~/.android ==="
          du -sh ~/.gradle 2>/dev/null || true
          du -sh ~/.android 2>/dev/null || true
          du -sh /usr/local/lib/android/sdk/ndk 2>/dev/null || true

      - name: Print APK signing certificate SHA-256
        continue-on-error: true
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -f "$APK" ]; then
            keytool -printcert -jarfile "$APK" | grep -i SHA256 || true
            echo "Copy the SHA-256 above into Firebase Console > App Check > Play Integrity."
          else
            echo "APK not found at $APK"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: byahetayo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
